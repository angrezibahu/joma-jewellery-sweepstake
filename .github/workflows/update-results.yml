name: Update results

on:
  schedule:
    # Hourly through the tournament: 11-30 June and 1-21 July (UTC).
    # Runs past the final (19 July, result due 23:00 UTC) so a single
    # flaky run near the end can't permanently miss the last results.
    - cron: "30 * 11-30 6 *"
    - cron: "30 * 1-21 7 *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: update-results

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Fetch scores and derive tournament state
        env:
          FOOTBALL_DATA_API_TOKEN: ${{ secrets.FOOTBALL_DATA_API_TOKEN }}
          FOOTBALL_DATA_COMPETITION: ${{ vars.FOOTBALL_DATA_COMPETITION }}
        run: python3 scripts/update_results.py

      - name: Commit and push if anything changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898026+github-actions[bot]@users.noreply.github.com"
          git add results.json tracker-state.json
          if git diff --cached --quiet; then
            echo "No new results."
            exit 0
          fi
          git commit -m "Auto-update match results"
          # main may have moved since checkout; rebase so the push can't race
          git pull --rebase origin main
          git push
          # A push made with GITHUB_TOKEN doesn't trigger other workflows,
          # so kick the Pages deploy explicitly.
          gh workflow run pages.yml --ref main
